[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-patterns"
version = "0.1.0"
description = "A ready-made vocabulary of regular expressions — dates, numbers, URLs, identifiers and more — built on simplibs-regex."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "regex",
    "regular-expressions",
    "patterns",
    "vocabulary",
    "validation",
    "simplibs",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
dependencies = [
    "simplibs-regex>=0.4.0",
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-patterns"
Repository = "https://github.com/simplibs/simplibs-patterns"
Issues = "https://github.com/simplibs/simplibs-patterns/issues"
Changelog = "https://github.com/simplibs/simplibs-patterns/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]
